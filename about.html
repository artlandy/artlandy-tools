<title>Artlandyについて</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Noto Sans JP",sans-serif;
    background:#F5F5F5;
    display:flex;
    justify-content:center;

    width:100px;
    margin-bottom:20px;
}

h1{
    color:#8F8A8A;
    font-size:30px;

    margin-bottom:30px;
}

.version{
    font-size:14px;
    color:#999;
    margin-bottom:30px;
}

.link{
    display:block;
    text-decoration:none;
    background:white;
    border:1px solid #ddd;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
    color:#555;
    transition:.2s;
}

.link:hover{
    background:#F8F8F8;
}

.home{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#8F8A8A;
    color:white;
    padding:14px 28px;

.footer{
